# Update the rich-gradient-cli formula in maxludden/homebrew-tap.
#
# Runs daily, or by hand from the Actions tab. It takes the latest version on
# PyPI (or the version you give it) and, once that release is at least a day
# old, points the formula at its sdist, regenerates the Python resources with
# `brew bump-formula-pr --write-only`, builds and tests the formula from
# source, then pushes the commit to the tap.
#
# Why not straight after publishing: Homebrew resolves Python resources with
# `pip --uploaded-prior-to=P1D` (its release cooldown), so a release can't be
# picked up until it has been on PyPI for a day.
#
# Needs a `HOMEBREW_TAP_TOKEN` secret: a fine-grained token with
# "Contents: read and write" on maxludden/homebrew-tap.
name: Update Homebrew tap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Version on PyPI to put in the formula (default the latest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-formula:
    name: Update rich-gradient-cli formula
    runs-on: macos-latest
    env:
      TAP: maxludden/tap
      FORMULA: rich-gradient-cli
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Find the sdist on PyPI
        id: pypi
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL "https://pypi.org/pypi/${FORMULA}/json" | jq -r .info.version)
          fi
          json=$(curl -fsSL "https://pypi.org/pypi/${FORMULA}/${version}/json")
          sdist=$(jq -c '.urls[] | select(.packagetype == "sdist")' <<<"$json")
          if [ -z "$sdist" ]; then
            echo "No sdist for ${FORMULA} ${version} on PyPI" >&2
            exit 1
          fi
          url=$(jq -r .url <<<"$sdist")
          uploaded=$(jq -r .upload_time_iso_8601 <<<"$sdist")
          {
            echo "version=${version}"
            echo "url=${url}"
            echo "sha256=$(jq -r .digests.sha256 <<<"$sdist")"
          } >> "$GITHUB_OUTPUT"
          age_hours=$(python3 -c 'import sys, datetime as d; t = d.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); print(int((d.datetime.now(d.timezone.utc) - t).total_seconds() // 3600))' "$uploaded")
          if [ "$age_hours" -lt 25 ]; then
            echo "::notice::${FORMULA} ${version} was uploaded ${age_hours}h ago; Homebrew's 1-day cooldown hasn't passed. A later run will pick it up."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tap maxludden/homebrew-tap
        if: steps.pypi.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          brew tap "$TAP"
          # Homebrew refuses to load formulae from third-party taps until they're trusted.
          brew trust "$TAP"
          tap_dir="$(brew --repository "$TAP")"
          git -C "$tap_dir" remote set-url origin "https://x-access-token:${TOKEN}@github.com/maxludden/homebrew-tap.git"
          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "TAP_DIR=${tap_dir}" >> "$GITHUB_ENV"

      - name: Update url, sha256 and Python resources
        if: steps.pypi.outputs.ready == 'true'
        id: bump
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
          URL: ${{ steps.pypi.outputs.url }}
          SHA256: ${{ steps.pypi.outputs.sha256 }}
        run: |
          if grep -qF "$URL" "$TAP_DIR/Formula/${FORMULA}.rb"; then
            echo "Formula already points at ${VERSION}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --write-only edits the tap in place (no PR); for a
          # Language::Python::Virtualenv formula it also regenerates the
          # resource blocks from the new sdist's dependencies.
          brew bump-formula-pr --write-only --no-audit --no-browse \
            --url "$URL" --sha256 "$SHA256" "${TAP}/${FORMULA}"
          git -C "$TAP_DIR" diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and test the formula
        if: steps.bump.outputs.changed == 'true'
        run: |
          brew install --build-from-source "${TAP}/${FORMULA}"
          brew test "${TAP}/${FORMULA}"
          brew audit --formula "${TAP}/${FORMULA}"

      - name: Commit and push to the tap
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          git -C "$TAP_DIR" add "Formula/${FORMULA}.rb"
          git -C "$TAP_DIR" commit -m "${FORMULA} ${VERSION}"
          git -C "$TAP_DIR" push origin HEAD:main
