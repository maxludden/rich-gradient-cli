name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] && [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Type check
        run: uv run --extra dev mypy
      - name: Test
        run: uv run --extra dev pytest -q
      - name: Build docs
        # The docs extra requires Python >= 3.11.
        if: matrix.python-version != '3.10'
        run: uv run --extra docs zensical build

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Check dist version matches release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              *"-${version}-"*|*"-${version}.tar.gz") ;;
              *) echo "$f does not match release version ${version}" >&2; exit 1 ;;
            esac
          done
      - name: Publish with trusted publishing
        run: uv publish --trusted-publishing always
