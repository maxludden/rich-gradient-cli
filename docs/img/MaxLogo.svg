<?xml version="1.0" encoding="UTF-8"?>
<svg id="maxlogo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586 586" width="586" height="586" role="img"
  aria-labelledby="maxlogo-title maxlogo-desc" xml:lang="en">
  <title id="maxlogo-title">MaxLogo</title>
  <desc id="maxlogo-desc">
    A personal logo for Max Ludden, consisting of three elements:
    1. A circle with a dynamic, animated gradient background.
    2. A black and white glyph combining the capital letters `M`, `A`, and `X`.
    3. The surname `LUDDEN` in white characters below the glyph.
  </desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
      xmlns:dcterms="http://purl.org/dc/terms/">
      <rdf:Description rdf:about="">
        <dc:title>MaxLogo</dc:title>
        <dc:creator>Max Ludden</dc:creator>
        <dc:publisher>Max Ludden</dc:publisher>
        <dcterms:rightsHolder>Max Ludden</dcterms:rightsHolder>
        <dc:date>2026-08-13</dc:date>
        <dc:identifier>MaxLogo-3.0.2</dc:identifier>
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:language>en</dc:language>
        <dc:description>Personal identity mark for Max Ludden: an animated gradient
          circle behind a monogram glyph combining the letters M, A and X, with the
          surname LUDDEN set below.</dc:description>
        <dc:rights>Copyright © 2026 Max Ludden. All rights reserved. MaxLogo™ and the
          MAX monogram are unregistered trademarks of Max Ludden. This mark is not
          licensed for reuse: it may not be reproduced, modified, recolored, or
          incorporated into any other work, nor used to identify any other person,
          product, service, or organization, without prior written permission from the
          rights holder.</dc:rights>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id='a' gradientUnits='objectBoundingBox' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#ff00ff'>
        <animate attributeName="stop-color"
          values="#ff00ff;#af00ff;#5f00ff;#0090ff;#00ffff;#00ff00;#99ff00;#ffff00;#ff8800;#ff0000;#ff00ff;" dur="20s"
          repeatCount="indefinite">
        </animate>
      </stop>
      <stop offset='50%' stop-color='#af00ff'>
        <animate attributeName="stop-color"
          values="#af00ff;#5f00ff;#0088ff;#00ffff;#00ff00;#99ff00;#ffff00;#ff8800;#ff0000;#ff00ff;#af00ff;" dur="20s"
          repeatCount="indefinite">
        </animate>
      </stop>
      <stop offset='100%' stop-color='#5f00ff'>
        <animate attributeName="stop-color"
          values="#5f00ff;#0090ff;#00ffff;#00ff00;#99ff00;#ffff00;#ff8800;#ff0000;#ff00ff;#af00ff;#5f00ff;" dur="20s"
          repeatCount="indefinite">
        </animate>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="20s"
        repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id='b' gradientUnits='objectBoundingBox' x1='0' y1='1' x2='1' y2='1'>
      <stop offset='0' stop-color='#ff00ff'>
        <animate attributeName="stop-color"
          values="#ff00ff;#af00ff;#5f00ff;#0090ff;#00ffff;#00ff00;#99ff00;#ffff00;#ff8800;#ff0000;#ff00ff;" dur="20s"
          repeatCount="indefinite">
        </animate>
      </stop>
      <stop offset='100%' stop-color='#af00ff' stop-opacity="0.1">
        <!-- This stop in gradient b drops opacity to 10% to allow gradient a to viewed through it -->
        <animate attributeName="stop-color"
          values="#af00ff;#5f00ff;#0088ff;#00ffff;#00ff00;#99ff00;#ffff00;#ff8800;#ff0000;#ff00ff;#af00ff;" dur="20s"
          repeatCount="indefinite">
        </animate>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" values="360 .5 .5;0 .5 .5" class="ignore"
        dur="20s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      #maxlogo #left-ludden {
        fill: #222;
      }

      #maxlogo #right {
        fill: #eee;
      }

      @media (prefers-color-scheme: dark) {

        #maxlogo #left-ludden {
          fill: #eee;
        }

        #maxlogo #right {
          fill: #222;
        }
      }

      #maxlogo #shadow {
        fill: #22222259;
      }

      #maxlogo #gradient-a {
        fill: url(#a);
      }

      #maxlogo #gradient-b {
        fill: url(#b);
      }

      @media (prefers-reduced-motion: reduce) {

        #maxlogo animate,
        #maxlogo animateTransform {
          display: none;
        }
      }
    </style>
  </defs>
  <circle id="gradient-a" cx="293" cy="293" r="285" />
  <circle id="gradient-b" cx="293" cy="293" r="285" />
