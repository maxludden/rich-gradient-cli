[project]
name = "rich-gradient-cli"
version = "0.4.7"
description = "Render files, URLs, stdin, and text with rich-gradient from the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maxwell Ludden", email = "maxludden@me.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21.1",
    "rich>=15.0.0",
    "rich-color-ext>=3.0.0",
    "rich-gradient>=0.4.4",
    "amplitude-analytics>=1.3.0",
    "rich-rst>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.15.0",
]
docs = [
    "mkdocstrings>=1.0.8",
    "mkdocstrings-python>=2.0.2",
    "zensical>=0.1.3",
    "zensical-gradient-theme>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/maxludden/rich-gradient-cli"
Documentation = "https://maxludden.github.io/rich-gradient-cli"
Repository = "https://github.com/maxludden/rich-gradient-cli"
Changelog = "https://github.com/maxludden/rich-gradient-cli/blob/master/CHANGELOG.md"

[project.scripts]
gradient = "rich_gradient_cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rich_gradient_cli"]

[tool.hatch.build.targets.sdist]
# Ship only what's needed to build the wheel, like uv_build did.
include = ["/src/rich_gradient_cli", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.uv]
# Ignore releases newer than 3 days (supply-chain safety). Set here, not only in
# the user-level uv.toml, so CI resolves with the same option and `--locked` passes.
exclude-newer = "3 days"
# Our own packages (the docs theme and rich-gradient) are exempt so their new
# releases are picked up immediately.
exclude-newer-package = { zensical-gradient-theme = false, rich-gradient = false }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "unused-argument",
    "W0613"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
