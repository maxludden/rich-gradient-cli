[project]
name = "rich-gradient-cli"
version = "0.4.1"
description = "Render files, URLs, stdin, and text with rich-gradient from the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maxwell Ludden", email = "maxludden@me.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21.1",
    "rich>=15.0.0",
    "rich-color-ext>=3.0.0",
    "rich-gradient>=0.4.1",
    "amplitude-analytics>=1.3.0",
    "rich-rst>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.15.0",
]
docs = [
    "mkdocstrings>=1.0.8",
    "mkdocstrings-python>=2.0.2",
    "zensical>=0.0.68",
]

[project.urls]
Homepage = "https://github.com/maxludden/rich-gradient-cli"
Documentation = "https://maxludden.github.io/rich-gradient-cli"
Repository = "https://github.com/maxludden/rich-gradient-cli"
Changelog = "https://github.com/maxludden/rich-gradient-cli/blob/master/CHANGELOG.md"

[project.scripts]
gradient = "rich_gradient_cli:entrypoint"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "unused-argument",
    "W0613"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
