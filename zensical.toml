[project]
site_name = "rich-gradient-cli"
site_description = "CLI for rich-gradient"
site_author = "Max Ludden"
site_url = "https://maxludden.github.io/rich-gradient-cli/"
repo_name = "rich-gradient-cli"
repo_url = "https://github.com/maxludden/rich-gradient-cli"
edit_uri = "edit/master/docs/"

extra_css = ["styles/style.css", "styles/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Usage" = "usage.md" },
    { "Commands" = "commands.md" },
    { "API" = "api.md" },
]

[project.theme]
variant = "classic"
logo = "img/rich-gradient-icon.svg"
favicon = "img/rich-gradient-icon.svg"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.sections",
    "navigation.path",
    "navigation.top",
    "navigation.footer",
    "toc.follow",
    "search.suggest",
    "search.highlight",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
]

[project.theme.font]
text = "Inter"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "astral-light"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "astral-light"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "astral-dark"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_if_no_docstring = true
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true

[project.extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/maxludden" },
    { icon = "fontawesome/brands/python", link = "https://pypi.org/project/rich-gradient-cli" },
]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]
